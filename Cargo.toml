[package]
name = "arduino-cli-client"
description = "gRPC client for arduino cli"
version = "0.1.2"
authors = ["marcelbuesing <buesing.marcel@googlemail.com>", "amarcolini"]
edition = "2021"
homepage = "https://github.com/amarcolini/arduino-cli-client"
repository = "https://github.com/amarcolini/arduino-cli-client.git"
keywords = ["arduino", "arduino-cli", "arduino-grpc"]
# License terms inherited from `arduino/arduino-cli`
license = "GPL-3.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tonic = "0.13.0"
prost = "0.13.5"
prost-types = "0.13.5"


[build-dependencies]
# tonic-buf-build = "0.3.0" TODO: come back when this is updated
tonic-build = "0.13.0"

[dev-dependencies]
tokio = { version = "1.44.2", features = ["full"] }
serde_json = "1.0"
